name: Deploy to ECS
description: Build Docker image, push to ECR, and deploy to ECS

inputs:
  aws-iam:
    description: Ending part of the ARN of the IAM role to assume for AWS credentials
    required: true
  cluster:
    description: Name of the ECS cluster to deploy to
    required: true

runs:
  using: composite
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::${{ inputs.aws-iam }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and tag web-server image
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      uses: docker/build-push-action@v7
      with:
        context: .
        tags: ${{ env.REGISTRY }}/docs-rs-web:latest
        target: web-server
        file: dockerfiles/Dockerfile
        push: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: GIT_VERSION=${{ github.sha }}

    - name: Build and tag registry-watcher image
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      uses: docker/build-push-action@v6
      with:
        context: .
        tags: ${{ env.REGISTRY }}/docs-rs-watcher:latest
        target: registry-watcher
        file: dockerfiles/Dockerfile
        push: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: GIT_VERSION=${{ github.sha }}

    - name: Build and tag build-server image
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      uses: docker/build-push-action@v6
      with:
        context: .
        tags: ${{ env.REGISTRY }}/docs-rs-builder:latest
        target: build-server
        file: dockerfiles/Dockerfile
        push: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: GIT_VERSION=${{ github.sha }}

    - name: Deploy web service
      shell: bash
      env:
        CLUSTER: ${{ inputs.cluster }}
        SERVICE: docs-rs-web
      run: |
        aws ecs update-service --service ${SERVICE} --cluster ${CLUSTER} --force-new-deployment

    - name: Deploy watcher service
      shell: bash
      env:
        CLUSTER: ${{ inputs.cluster }}
        SERVICE: docs-rs-watcher
      run: |
        aws ecs update-service --service ${SERVICE} --cluster ${CLUSTER} --force-new-deployment

    - name: Deploy builder service
      shell: bash
      env:
        CLUSTER: ${{ inputs.cluster }}
        SERVICE: docs-rs-builder
      run: |
        aws ecs update-service --service ${SERVICE} --cluster ${CLUSTER} --force-new-deployment

    - name: Wait for services to stabilize
      shell: bash
      env:
        CLUSTER: ${{ inputs.cluster }}
      run: |
        aws ecs wait services-stable --services docs-rs-web docs-rs-watcher docs-rs-builder --cluster ${CLUSTER}
